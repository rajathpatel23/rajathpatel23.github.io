<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
    <marker id="arrow-white" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f9fafb" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">CPR Copilot — FSM-Controlled Agent Architecture</text>
  <text x="400" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">App controls state transitions · Model provides guidance within each state</text>

  <!-- States row -->
  <!-- intake -->
  <rect x="30" y="100" width="110" height="56" rx="10" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="85" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">intake</text>
  <text x="85" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe">collect caller info</text>

  <!-- escalation -->
  <rect x="178" y="100" width="110" height="56" rx="10" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="233" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">escalation</text>
  <text x="233" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe">call 911 prompt</text>

  <!-- see_patient -->
  <rect x="326" y="100" width="118" height="56" rx="10" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="385" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">see_patient</text>
  <text x="385" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe">assess via camera</text>

  <!-- start_compressions -->
  <rect x="482" y="100" width="136" height="56" rx="10" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="550" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">start_compressions</text>
  <text x="550" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fca5a5">guide chest compressions</text>

  <!-- continue_cpr -->
  <rect x="334" y="230" width="118" height="56" rx="10" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="393" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">continue_cpr</text>
  <text x="393" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fca5a5">30 compressions + 2 breaths</text>

  <!-- complete -->
  <rect x="490" y="230" width="110" height="56" rx="10" fill="#15803d" stroke="#166534" stroke-width="1.5"/>
  <text x="545" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">complete</text>
  <text x="545" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bbf7d0">EMS arrived / done</text>

  <!-- Arrows between states -->
  <!-- intake → escalation -->
  <line x1="140" y1="128" x2="175" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- escalation → see_patient -->
  <line x1="288" y1="128" x2="323" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- see_patient → start_compressions -->
  <line x1="444" y1="128" x2="479" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- start_compressions → continue_cpr (down+left) -->
  <path d="M550,156 L550,190 L393,190 L393,227" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- continue_cpr → complete -->
  <line x1="452" y1="258" x2="487" y2="258" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- continue_cpr self-loop -->
  <path d="M393,230 Q393,200 365,205 Q337,210 340,230" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="340" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">cycle</text>

  <!-- Gemini Live box -->
  <rect x="30" y="230" width="260" height="116" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="160" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">Gemini Live (audio + video)</text>

  <text x="44" y="276" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350f">
    <tspan x="44" dy="0">· Streams browser mic + camera</tspan>
    <tspan x="44" dy="16">· Responds in natural speech</tspan>
    <tspan x="44" dy="16">· Sees patient, guides hands</tspan>
    <tspan x="44" dy="16">· Bounded by FSM state prompt</tspan>
  </text>

  <!-- Arrow from Gemini to states area -->
  <line x1="290" y1="270" x2="330" y2="258" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="305" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#d97706">guidance</text>

  <!-- FSM label -->
  <text x="400" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b7280">State transitions enforced by app · Model cannot advance or skip states</text>

  <!-- Legend -->
  <rect x="620" y="230" width="15" height="15" rx="3" fill="#1e40af"/>
  <text x="640" y="242" font-family="system-ui, sans-serif" font-size="10" fill="#374151">Assessment states</text>
  <rect x="620" y="254" width="15" height="15" rx="3" fill="#dc2626"/>
  <text x="640" y="266" font-family="system-ui, sans-serif" font-size="10" fill="#374151">Active CPR states</text>
  <rect x="620" y="278" width="15" height="15" rx="3" fill="#15803d"/>
  <text x="640" y="290" font-family="system-ui, sans-serif" font-size="10" fill="#374151">Terminal state</text>
</svg>
